name: Open LMS checks
on:
  push:
    branches: [feature/open-lms-design]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/open-lms.test.cjs
      - run: node --check open-lms-data.js
