<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | SLIATE GPA Calculator</title><style>
:root{color-scheme:dark;--bg:#08090c;--panel:#111318;--line:#292d36;--text:#f3f4f6;--muted:#a0a5b0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:25px 14px;background:radial-gradient(ellipse at top,#17191e 0,#08090c 55%);color:var(--text);font:15px/1.6 system-ui,sans-serif}.wrap{width:min(100%,900px);margin:auto}h1{font-size:clamp(28px,5vw,40px);margin:8px 0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}input,button{font:inherit;border-radius:10px;padding:12px;width:100%}input{background:#090a0e;color:white;border:1px solid #353943;margin:6px 0 14px}button,.btn{border:1px solid #555b66;background:#e8e9ec;color:#090a0c;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;padding:11px 16px;border-radius:10px}.alt{background:#171a20;color:white;border-color:#363b45}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{color:#bbc0c9;min-height:24px}.muted{color:var(--muted);font-size:13px}table{width:100%;border-collapse:collapse;min-width:580px}td,th{text-align:left;padding:11px;border-bottom:1px solid #292d36}.tablewrap{overflow:auto}
</style></head><body><main class="wrap"><div class="muted">SLIATE GPA CALCULATOR · USER ACCOUNT</div><h1>Welcome back</h1><p>Sign in to access your saved GPA records from any device.</p><section class="panel"><form id="authForm"><label>Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"><button type="submit" id="submit">Sign in</button></form><p class="status" id="status"></p><div class="links"><a class="btn alt" href="register.html">Create a new account</a><a class="btn alt" href="index.html">Home</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const form=document.getElementById('authForm'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const btn=document.getElementById('submit');btn.disabled=true;status.textContent='Please wait…';try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;const next=new URLSearchParams(location.search).get('next');location.href=next==='Cal.html'?'Cal.html':'save.html'; }catch(err){status.textContent=err.message||'Something went wrong.'}finally{btn.disabled=false}});</script></body></html>
